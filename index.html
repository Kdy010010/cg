<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ 비술의 격전</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#06080f;--bg2:#0d1120;--panel:#111827;--brd:#1e2d40;--gold:#c9a227;--gold2:#f0c040;--txt:#dde4ef;--dim:#6b7c9a;--fire:#ff4e1a;--water:#1ab8ff;--earth:#7ab83a;--wind:#a0e8e0;--shadow:#9b4dff;--light:#ffe066;--thunder:#f0e040;--ice:#80dfff;--nature:#50c060;--c1:#8fa0b0;--c2:#4da6ff;--c3:#cc44ff;--c4:#ffaa00;--ally:#4da6ff;--enemy:#ff5a5a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 0%,#0a1a3a 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 20% 100%,#0d0a1e 0%,transparent 50%),radial-gradient(ellipse 60% 40% at 80% 100%,#0a1808 0%,transparent 50%),var(--bg)}
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;overflow-y:auto;padding:14px 0}
.screen.hidden{display:none}
#lobby{background:linear-gradient(160deg,#0d1120,#06080f)}
.logo{font-family:'Noto Serif KR',serif;font-size:clamp(1.6rem,6vw,3rem);font-weight:700;letter-spacing:.1em;background:linear-gradient(135deg,#c9a227,#fff8dc,#c9a227);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px #c9a22744)}50%{filter:drop-shadow(0 0 44px #c9a22799)}}
.sub{color:var(--dim);font-size:.85rem;letter-spacing:.15em}
.panel{background:rgba(17,24,39,.96);border:1px solid var(--brd);border-radius:14px;padding:18px 22px;width:min(440px,93vw);display:flex;flex-direction:column;gap:12px;box-shadow:0 0 50px #00000088,inset 0 1px 0 #ffffff0a}
.ig{display:flex;flex-direction:column;gap:4px}
.ig label{font-size:.68rem;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
input[type=text]{background:#06080f;border:1px solid var(--brd);border-radius:7px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:.9rem;padding:10px 13px;outline:none;transition:border-color .2s;width:100%}
input[type=text]:focus{border-color:var(--gold)}
#codein{font-size:1.5rem;letter-spacing:.4em;text-align:center;font-weight:700}
.btn{font-family:'Noto Sans KR',sans-serif;font-size:.85rem;font-weight:700;padding:11px 18px;border-radius:7px;border:none;cursor:pointer;transition:all .2s;width:100%}
.bp{background:linear-gradient(135deg,#9a7a12,#c9a227,#dbb830);color:#1a1200;box-shadow:0 4px 18px #c9a22744}
.bp:hover{transform:translateY(-1px);box-shadow:0 6px 24px #c9a22766}
.bp:active{transform:scale(.98)}
.bp:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bs{background:transparent;border:1px solid var(--brd);color:var(--dim)}
.bs:hover{border-color:var(--gold);color:var(--gold)}
.dv{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.7rem}
.dv::before,.dv::after{content:'';flex:1;height:1px;background:var(--brd)}
.smsg{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--gold);text-align:center;min-height:16px}
/* mode selectors */
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#06080f;border:1px solid var(--brd);color:var(--dim);border-radius:7px;padding:9px 4px;font-family:'Noto Sans KR';font-weight:700;font-size:.8rem;cursor:pointer;transition:all .18s}
.seg button .sd{display:block;font-size:.56rem;font-weight:400;color:var(--dim);margin-top:2px}
.seg button.sel{border-color:var(--gold);color:var(--gold2);background:#13110a;box-shadow:0 0 12px #c9a22733}
.seg button.sel .sd{color:#b8973a}
/* loader */
#loadover{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#loadover.hidden{display:none}
.spinner{width:38px;height:38px;border:3px solid var(--brd);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* room / waiting */
.codebox{text-align:center;background:#06080f;border:1px solid var(--gold);border-radius:10px;padding:12px;cursor:pointer}
.codebox .cl2{font-size:.62rem;color:var(--dim);letter-spacing:.2em}
.codebox .cv{font-family:'JetBrains Mono',monospace;font-size:2.6rem;font-weight:700;letter-spacing:.3em;color:var(--gold2);text-shadow:0 0 18px #c9a22755}
.seatlist{display:flex;flex-direction:column;gap:5px}
.seatrow{display:flex;align-items:center;gap:8px;background:#06080f;border:1px solid var(--brd);border-radius:7px;padding:7px 11px;font-size:.8rem}
.seatrow .tg{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:4px}
.tg0{background:#0d2a4a;color:#7ac0ff}.tg1{background:#4a1010;color:#ff9090}
.seatrow .snm{flex:1;color:var(--txt)}
.seatrow .stat{font-size:.62rem;color:var(--dim)}
.seatrow.empty .snm{color:var(--dim);font-style:italic}
/* ── GAME ── */
#game{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:4px;gap:3px}
#game.hidden{display:none}
.zone{display:flex;gap:5px;overflow-x:auto;padding:2px;align-items:stretch;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:0 0 auto}
.zone::-webkit-scrollbar{display:none}
.zone.enemy{align-items:flex-start}
.pp{flex:1 1 0;min-width:118px;background:rgba(17,24,39,.85);border:1.5px solid var(--brd);border-radius:10px;padding:5px 6px;display:flex;flex-direction:column;gap:4px;transition:border-color .25s,box-shadow .25s;position:relative}
.pp.ally{border-color:#1e3a55}.pp.enemy{border-color:#4a2030}
.pp.turn{border-color:var(--gold);box-shadow:0 0 16px #c9a22744}
.pp.me::after{content:'나';position:absolute;top:-1px;right:5px;font-size:.5rem;color:var(--gold2);background:#13110a;padding:0 4px;border-radius:0 0 4px 4px}
.pp.dead{opacity:.35;filter:grayscale(.8)}
.pp.tgt-hero{cursor:pointer;border-color:var(--enemy);box-shadow:0 0 14px #ff444466;animation:tgp .8s ease-in-out infinite}
@keyframes tgp{50%{box-shadow:0 0 22px #ff4444aa}}
.pph{display:grid;grid-template-columns:26px 1fr auto;gap:5px;align-items:center}
.pav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;border:1.5px solid var(--brd);background:var(--panel)}
.pmid{min-width:0;display:flex;flex-direction:column;gap:1px}
.pnm{font-family:'Noto Serif KR',serif;font-size:.62rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp.ally .pnm{color:#7ac0ff}.pp.enemy .pnm{color:#ff9090}
.hprow{display:flex;align-items:center;gap:4px}
.hpbar{flex:1;height:6px;background:#1a0a0a;border-radius:3px;overflow:hidden;border:1px solid #3a0000;min-width:40px}
.hpfill{height:100%;border-radius:3px;transition:width .45s;background:linear-gradient(90deg,#c0392b,#e74c3c,#ff6b6b)}
.hptx{font-family:'JetBrains Mono',monospace;font-size:.6rem;white-space:nowrap}
.pright{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.mn{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:#4da6ff;font-weight:700;white-space:nowrap}
.dk{font-size:.52rem;color:var(--dim);white-space:nowrap}
.hero-fx{display:flex;gap:2px;justify-content:flex-end;min-height:8px}
.hero-fx span{font-size:.52rem}
.ppb{display:flex;gap:3px;flex-wrap:wrap;min-height:46px;padding-top:2px;border-top:1px solid #ffffff0c;align-content:flex-start}
.ehand{display:flex;gap:2px;justify-content:center;min-height:14px;margin-bottom:1px}
.ehc{width:9px;height:13px;border-radius:2px;background:linear-gradient(135deg,#0d1a2e,#1a0d2e);border:1px solid #2a2030}
/* tokens */
.tok{width:50px;border-radius:7px;border:1.5px solid var(--brd);background:var(--panel);position:relative;overflow:hidden;cursor:default;transition:transform .15s,box-shadow .15s;flex-shrink:0}
.tok .te{height:26px;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.tok .tstat{display:flex;justify-content:space-between;padding:1px 3px 2px;background:rgba(0,0,0,.5)}
.tok .ta{color:#ff9a8a;font-family:'JetBrains Mono';font-size:.6rem;font-weight:700}
.tok .th{color:#9affb0;font-family:'JetBrains Mono';font-size:.6rem;font-weight:700}
.tok .ico{position:absolute;top:1px;right:1px;font-size:.5rem;line-height:1}
.tok .tnm{font-size:.32rem;text-align:center;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;line-height:1.3}
.tok.cana{box-shadow:0 0 7px #4af6;border-color:#4af}
.tok.sel{border-color:#fff;box-shadow:0 0 12px #fff8;transform:translateY(-4px) scale(1.08)}
.tok.tgt{cursor:pointer;border-color:var(--enemy);box-shadow:0 0 10px #ff4444aa;animation:tgp .8s ease-in-out infinite}
.tok.frz{border-color:var(--ice)}
.tok.taunt{box-shadow:inset 0 0 0 2px #7a1a00}
.el-fire.tok{border-top:2px solid var(--fire)}.el-water.tok{border-top:2px solid var(--water)}.el-earth.tok{border-top:2px solid var(--earth)}.el-wind.tok{border-top:2px solid var(--wind)}.el-shadow.tok{border-top:2px solid var(--shadow)}.el-light.tok{border-top:2px solid var(--light)}.el-thunder.tok{border-top:2px solid var(--thunder)}.el-ice.tok{border-top:2px solid var(--ice)}.el-nature.tok{border-top:2px solid var(--nature)}
/* center bar */
.cl{display:flex;align-items:center;padding:4px 10px;background:rgba(11,16,28,.95);border-top:1px solid var(--brd);border-bottom:1px solid var(--brd);gap:8px;flex:0 0 auto;height:38px}
.ti{font-family:'Noto Serif KR',serif;font-size:.72rem;color:var(--dim);font-weight:600;flex-shrink:0;min-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti.on{color:var(--gold2);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.glog{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--dim);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glog span{color:var(--gold)}
.bet{font-family:'Noto Sans KR';font-weight:700;font-size:.72rem;padding:6px 14px;background:linear-gradient(135deg,#1a3a1a,#2a5a2a);color:#7aff7a;border:1px solid #2a6a2a;border-radius:5px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s}
.bet:hover:not(:disabled){box-shadow:0 0 12px #00ff0033}
.bet:disabled{opacity:.3;cursor:not-allowed}
/* hand */
.handwrap{flex:0 0 auto;background:rgba(6,8,15,.6);border-top:1px solid var(--brd);padding-top:2px}
.ha{display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:3px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ha::-webkit-scrollbar{display:none}
.midfill{flex:1 1 auto;min-height:0}
.card{width:72px;border-radius:9px;border:1.5px solid transparent;background:var(--panel);cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,border-color .25s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.card.play{border-color:var(--gold);box-shadow:0 0 8px #c9a22755}
.card.sel{border-color:#fff;box-shadow:0 0 14px #ffffff66;transform:translateY(-10px) scale(1.04)}
.card:hover{transform:translateY(-6px) scale(1.03)}
.ci{border-radius:8px;overflow:hidden;position:relative}
.cc{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7ad4ff,#1a7aff);border:1px solid #4af;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-size:.64rem;font-weight:700;color:#fff;z-index:2}
.ca2{height:44px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;position:relative;overflow:hidden}
.cab{position:absolute;inset:0;opacity:.28}
.cb{padding:3px 4px 4px;background:rgba(0,0,0,.65)}
.cn{font-family:'Noto Serif KR';font-size:.42rem;font-weight:700;color:var(--gold2);text-align:center;line-height:1.2;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{font-size:.34rem;color:var(--dim);text-align:center;margin-bottom:1px}
.cd{font-size:.36rem;color:var(--txt);text-align:center;line-height:1.3;min-height:16px;font-style:italic;word-break:keep-all}
.cs2{display:flex;justify-content:space-between;align-items:center;margin-top:2px;padding-top:2px;border-top:1px solid #ffffff11}
.sa{background:linear-gradient(135deg,#7a1a00,#c0392b);color:#ffcccc;border-radius:3px;padding:1px 4px;font-family:'JetBrains Mono';font-size:.56rem;font-weight:700}
.sh{background:linear-gradient(135deg,#003a00,#27ae60);color:#ccffcc;border-radius:3px;padding:1px 4px;font-family:'JetBrains Mono';font-size:.56rem;font-weight:700}
.gem{width:5px;height:5px;border-radius:50%}
.el-fire .cab{background:radial-gradient(circle,#ff4e1a44,#8b000044)}.el-fire .ci{border-top:2px solid var(--fire)}
.el-water .cab{background:radial-gradient(circle,#1ab8ff33,#00407733)}.el-water .ci{border-top:2px solid var(--water)}
.el-earth .cab{background:radial-gradient(circle,#7ab83a33,#2d4a0033)}.el-earth .ci{border-top:2px solid var(--earth)}
.el-wind .cab{background:radial-gradient(circle,#a0e8e033,#204a4433)}.el-wind .ci{border-top:2px solid var(--wind)}
.el-shadow .cab{background:radial-gradient(circle,#9b4dff33,#1a004433)}.el-shadow .ci{border-top:2px solid var(--shadow)}
.el-light .cab{background:radial-gradient(circle,#ffe06633,#6a500033)}.el-light .ci{border-top:2px solid var(--light)}
.el-thunder .cab{background:radial-gradient(circle,#f0e04033,#4a3a0033)}.el-thunder .ci{border-top:2px solid var(--thunder)}
.el-ice .cab{background:radial-gradient(circle,#80dfff33,#00304433)}.el-ice .ci{border-top:2px solid var(--ice)}
.el-nature .cab{background:radial-gradient(circle,#50c06033,#0a3a1033)}.el-nature .ci{border-top:2px solid var(--nature)}
.rarity-common .gem{background:var(--c1)}.rarity-rare .gem{background:var(--c2);box-shadow:0 0 3px var(--c2)}.rarity-epic .gem{background:var(--c3);box-shadow:0 0 4px var(--c3)}.rarity-legendary .gem{background:var(--c4);box-shadow:0 0 6px var(--c4);animation:gg 2s ease-in-out infinite}
@keyframes gg{50%{box-shadow:0 0 12px var(--c4)}}
#pl{position:fixed;inset:0;pointer-events:none;z-index:100}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:pf .8s ease-out forwards}
@keyframes pf{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.notif{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:rgba(11,16,28,.97);border:1px solid var(--gold);border-radius:7px;padding:7px 16px;font-size:.8rem;font-weight:500;color:var(--gold2);z-index:200;animation:nfa 2.5s ease forwards;box-shadow:0 0 24px #c9a22733;pointer-events:none;white-space:nowrap;max-width:92vw;text-align:center}
@keyframes nfa{0%{opacity:0;transform:translateX(-50%) translateY(-7px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-7px)}}
.tt{position:fixed;z-index:500;background:rgba(11,16,28,.98);border:1px solid var(--gold);border-radius:9px;padding:9px 12px;width:178px;pointer-events:none;display:none;box-shadow:0 0 24px #00000088}
.tt.vis{display:block}
.ttn{font-family:'Noto Serif KR';font-size:.72rem;font-weight:700;color:var(--gold2);margin-bottom:3px}
.ttd{font-size:.74rem;color:var(--txt);line-height:1.4;margin-bottom:5px;word-break:keep-all}
.tts{font-family:'JetBrains Mono';font-size:.68rem;display:flex;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.tte{display:flex;gap:2px;flex-wrap:wrap}
.ttb{font-size:.56rem;padding:2px 5px;border-radius:3px;background:#1a2a3a;color:var(--dim)}
#wo{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
#wo.hidden{display:none}
.wt{font-family:'Noto Serif KR';font-size:clamp(2rem,8vw,4.2rem);font-weight:900;animation:glow 1.5s ease-in-out infinite;text-align:center}
.wt.win{background:linear-gradient(135deg,#c9a227,#fff8dc,#c9a227);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wt.lose{color:#ff4444;-webkit-text-fill-color:#ff4444}
.ws{font-size:.95rem;color:var(--dim);text-align:center}
.wo-btns{display:flex;flex-direction:column;gap:10px;width:min(300px,90vw)}
.rmstat{font-family:'JetBrains Mono';font-size:.78rem;color:var(--dim);text-align:center;min-height:20px}
.rmstat.waiting{color:var(--gold);animation:nfa-b .9s ease-in-out infinite}
@keyframes nfa-b{50%{opacity:.4}}
</style>
</head>
<body>
<div class="bg"></div>
<div id="pl"></div>
<div class="tt" id="tt"></div>

<div id="loadover">
  <div class="spinner"></div>
  <div style="color:var(--dim);font-size:.85rem">카드 데이터 로딩 중...</div>
</div>

<!-- ───── LOBBY ───── -->
<div id="lobby" class="screen hidden">
  <div class="logo">⚔ 비술의 격전</div>
  <div class="sub">— 온라인 팀 카드 배틀 —</div>
  <div class="panel">
    <div class="ig"><label>마법사 이름</label><input type="text" id="mn" placeholder="이름 입력" value="마법사"></div>

    <div class="ig"><label>팀 규모</label>
      <div class="seg" id="segTeam">
        <button data-v="1v1" class="sel">1 vs 1</button>
        <button data-v="2v2">2 vs 2</button>
        <button data-v="3v3">3 vs 3</button>
      </div>
    </div>
    <div class="ig"><label>규칙 모드</label>
      <div class="seg" id="segRule">
        <button data-v="std" class="sel">표준<span class="sd">HP30·1마나</span></button>
        <button data-v="blitz">속공<span class="sd">HP25·2마나</span></button>
      </div>
      <div class="seg" id="segRule2" style="margin-top:6px">
        <button data-v="titan">거인<span class="sd">HP50·장기전</span></button>
        <button data-v="chaos">혼돈<span class="sd">HP30·2장뽑기</span></button>
      </div>
    </div>

    <button class="btn bp" onclick="hostRoom()">🏰 방 만들기 (호스트)</button>
    <div class="dv">친구 방에 참가</div>
    <div class="ig"><label>방 코드 (4자리)</label><input type="text" id="codein" placeholder="0000" maxlength="4" inputmode="numeric"></div>
    <button class="btn bp" onclick="joinRoom()">⚔ 코드로 참가!</button>
    <div class="dv">또는</div>
    <button class="btn bs" onclick="playSolo()">🤖 AI와 대결 (솔로)</button>
    <div class="smsg" id="lstat"></div>
  </div>
</div>

<!-- ───── WAITING ROOM ───── -->
<div id="room" class="screen hidden">
  <div class="logo" style="font-size:clamp(1.3rem,5vw,2.2rem)">⚔ 대기실</div>
  <div class="panel">
    <div class="codebox" id="codebox" onclick="copyCode()">
      <div class="cl2">방 코드 — 탭하여 복사</div>
      <div class="cv" id="codev">----</div>
    </div>
    <div style="text-align:center;font-size:.72rem;color:var(--dim)" id="roomMode"></div>
    <div class="seatlist" id="seatlist"></div>
    <button class="btn bp" id="startBtn" onclick="hostStart()">🎮 게임 시작 (빈자리 AI)</button>
    <div class="smsg" id="rstat"></div>
    <button class="btn bs" onclick="leaveRoom()">← 나가기</button>
  </div>
</div>

<!-- ───── GAME ───── -->
<div id="game" class="hidden">
  <div class="zone enemy" id="zEnemy"></div>
  <div class="cl">
    <div class="ti" id="ti">대기 중...</div>
    <div class="glog" id="gl">게임 시작!</div>
    <button class="bet" id="bet" onclick="reqEnd()" disabled>턴 종료 ↵</button>
  </div>
  <div class="midfill"></div>
  <div class="zone ally" id="zAlly"></div>
  <div class="handwrap"><div class="ha" id="ph"></div></div>
</div>

<!-- ───── WIN ───── -->
<div id="wo" class="hidden">
  <div class="wt" id="wt">승리!</div>
  <div class="ws" id="ws"></div>
  <div class="rmstat" id="rmstat"></div>
  <div class="wo-btns">
    <button class="btn bp" id="btnRe" onclick="rematch()">🔄 다시 하기</button>
    <button class="btn bs" onclick="goLobby()">🏠 로비로</button>
  </div>
</div>

<script>
/* ═══════════ 설정/맵 ═══════════ */
const AMAP={fire:{c:"#ff4e1a",n:14},ice:{c:"#80dfff",n:14},shadow:{c:"#9b4dff",n:14},holy:{c:"#ffe066",n:18},lightning:{c:"#a0e8e0",n:12},earth:{c:"#7ab83a",n:10},nature:{c:"#50c060",n:12},thunder:{c:"#f0e040",n:12},default:{c:"#cccccc",n:6}};
const KW={taunt:"도발",charge:"돌격",divine:"신성",lifesteal:"생명흡수",poison:"독",rush:"급습",reborn:"재탄생"};
const EL={fire:"화염",water:"물",earth:"대지",wind:"바람",shadow:"어둠",light:"빛",thunder:"번개",ice:"얼음",nature:"자연"};
const TP={c:"크리처",s:"주문",a:"유물"};
const RL={common:"일반",rare:"레어",epic:"에픽",legendary:"전설"};
const RC={common:"#8fa0b0",rare:"#4da6ff",epic:"#cc44ff",legendary:"#ffaa00"};
const MX=10,DSZ=40;
const TEAMS={'1v1':[1,1],'2v2':[2,2],'3v3':[3,3]};
const RULES={
  std:{name:'표준',hp:30,startMana:0,manaStep:1,draw:1,open:4},
  blitz:{name:'속공',hp:25,startMana:1,manaStep:2,draw:1,open:4},
  titan:{name:'거인',hp:50,startMana:0,manaStep:1,draw:1,open:4},
  chaos:{name:'혼돈',hp:30,startMana:0,manaStep:1,draw:2,open:5}
};
const TARGET_EF=['dmg3','dmg4','dmg5','dmg15','freeze1','hero-dmg8'];

/* ═══════════ 카드 로딩 (원본 유지 — 건드리지 않음) ═══════════ */
let DB=[];
async function loadCards(){
  try{
    const r=await fetch('./cards.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    DB=await r.json();
    console.log('카드 로드:',DB.length,'장');
  }catch(e){
    console.error(e);
    notify('카드 로드 실패! 새로고침 해주세요.');
  }
}

/* ═══════════ 상태 ═══════════ */
let peer=null, conns=[], hostConn=null;     // conns: 호스트가 보유한 게스트 연결들
let isHost=false, MYSEAT=0, soloMode=false;
let selMode='1v1', selRule='std';
let G=null;                                  // 게임 상태 (호스트=원본, 게스트=수신본)
let sel=null;                                // {kind:'attack',mi}|{kind:'spell',hi,card}
let prevHp={};                               // fx 비교용

/* ═══════════ 덱/카드 (원본 로직 유지) ═══════════ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(){
  if(!DB.length){notify('카드 데이터 없음!');return[];}
  const pool=[...DB],dk=[];
  const need={legendary:2,epic:4,rare:10,common:16};
  ['legendary','epic','rare','common'].forEach(r=>{
    const cs=pool.filter(c=>c.r===r);if(!cs.length)return;
    while(dk.filter(c=>c.r===r).length<need[r])dk.push(JSON.parse(JSON.stringify(cs[Math.floor(Math.random()*cs.length)])));
  });
  while(dk.length<DSZ)dk.push(JSON.parse(JSON.stringify(pool[Math.floor(Math.random()*pool.length)])));
  return shuffle(dk.slice(0,DSZ));
}
function prep(c){c=JSON.parse(JSON.stringify(c));c.chp=c.h;c.catk=c.a;c.canAtk=false;c.frozen=false;c.ds=false;return c;}

/* ═══════════ 엔진 (호스트 전용 실행) ═══════════ */
function makePlayers(mode,rule,seatNames){
  const [t0,t1]=TEAMS[mode];const R=RULES[rule];const players=[];let seat=0;const max=Math.max(t0,t1);
  for(let i=0;i<max;i++){
    if(i<t0)players.push(mkPlayer(seat++,0,R));
    if(i<t1)players.push(mkPlayer(seat++,1,R));
  }
  return players;
}
function mkPlayer(idx,team,R){return {idx,team,name:'AI',hp:R.hp,maxHp:R.hp,mn:0,mmn:R.startMana,deck:buildDeck(),hand:[],field:[],heroDivine:false,heroAtk:0,isAI:true,alive:true};}
function P(s){return G.players[s];}
function enemySeats(s){return G.players.filter(p=>p.alive&&p.team!==P(s).team).map(p=>p.idx);}
function allySeats(s,self=true){return G.players.filter(p=>p.alive&&p.team===P(s).team&&(self||p.idx!==s)).map(p=>p.idx);}
function enemyMinions(s){const a=[];enemySeats(s).forEach(e=>P(e).field.forEach((c,i)=>a.push({s:e,i,c})));return a;}
function randEnemyMinion(s){const a=enemyMinions(s);return a.length?a[Math.floor(Math.random()*a.length)]:null;}
function randEnemyHero(s){const e=enemySeats(s);return e.length?e[Math.floor(Math.random()*e.length)]:null;}
function draw(s,n=1){for(let i=0;i<n;i++){const p=P(s);if(!p.deck.length)return;if(p.hand.length>=10)return;p.hand.push(prep(p.deck.pop()));}}
function healHero(s,a){const p=P(s);p.hp=Math.min(p.maxHp,p.hp+a);}
function hitMinion(c,d){if(!c)return;if(c.ds){c.ds=false;return;}c.chp-=d;}

function startGame(mode,rule,names){
  const R=RULES[rule];
  G={mode,rule,R,players:makePlayers(mode,rule),order:[],turnSeat:0,started:true,winnerTeam:null,log:'게임 시작!'};
  // 좌석에 이름/AI여부 배정
  (names||[]).forEach(n=>{const p=G.players[n.seat];if(p){p.name=n.name;p.isAI=false;}});
  G.players.forEach(p=>{if(p.isAI)p.name=AI_NAME();});
  G.order=G.players.map(p=>p.idx);
  G.players.forEach(p=>{for(let i=0;i<R.open;i++)draw(p.idx);});
  G.turnSeat=G.order[0];
  prevHp={};G.players.forEach(p=>prevHp[p.idx]=p.hp);
  hbeginTurn(G.turnSeat,true);
}
let AI_IDX=0;
function AI_NAME(){const names=['아케인봇','그림자술사','불꽃현자','서리괴뢰','대지수호','폭풍술객'];return names[(AI_IDX++)%names.length];}

function hbeginTurn(s,first){
  const p=P(s);G.turnSeat=s;
  p.mmn=Math.min(MX,p.mmn+G.R.manaStep);p.mn=p.mmn;
  draw(s,G.R.draw);
  p.field.forEach(c=>{if(c){c.canAtk=true;if(c.frozen){c.frozen=false;c.canAtk=false;}}});
  p.field.filter(c=>c&&c.ef.includes('regen2')).forEach(()=>healHero(s,2));
  p.field.filter(c=>c&&c.ef.includes('regen')).forEach(()=>p.field.forEach(c2=>{if(c2)c2.chp=Math.min(c2.h,c2.chp+1);}));
  G.log=`${p.name}의 턴`;
  broadcast();
  if(P(s).isAI){setTimeout(()=>aiRun(s),700);}
}
function nextSeat(){const n=G.players.length,start=G.order.indexOf(G.turnSeat);for(let k=1;k<=n;k++){const s=G.order[(start+k)%n];if(P(s).alive)return s;}return G.turnSeat;}
function hAdvance(s){if(s!==G.turnSeat)return;if(G.winnerTeam!==null)return;const nx=nextSeat();hbeginTurn(nx);}

function cleanDead(s){
  const p=P(s);
  p.field.forEach(c=>{
    if(c&&c.chp<=0){
      if(c.ef.includes('dr-freeze')){const t=randEnemyMinion(s);if(t){t.c.frozen=true;t.c.canAtk=false;}}
      if(c.ef.includes('dr-dmg1')){const t=randEnemyMinion(s);if(t)hitMinion(t.c,1);else{const h=randEnemyHero(s);if(h!=null)P(h).hp-=1;}}
      if(c.ef.includes('dr-hero-divine'))P(s).heroDivine=true;
      if(c.ef.includes('reborn')&&!c._rb){c.chp=1;c._rb=true;return;}
    }
  });
  p.field=p.field.filter(c=>c&&c.chp>0);
}
function cleanAll(){G.players.forEach(p=>cleanDead(p.idx));}

function hPlay(s,idx,target){
  const p=P(s);if(s!==G.turnSeat)return;
  const card=p.hand[idx];if(!card)return;
  if(p.mn<card.c)return;
  if(card.t==='c'&&p.field.length>=7)return;
  p.mn-=card.c;p.hand.splice(idx,1);
  if(card.t==='c'){
    card.canAtk=card.ef.includes('charge')||card.ef.includes('rush');
    card.ds=card.ef.includes('divine');
    applyBC(card,s);applyAura(card,s);p.field.push(card);
  }else if(card.t==='s')applySpell(card,s,target);
  else if(card.t==='a')applyArtifact(card,s);
  G.log=`${p.name}: <span>${card.n}</span>`;
  cleanAll();checkWin();broadcast();
}
function applyBC(card,s){
  const ef=card.ef;
  if(ef.includes('bc-heal1'))healHero(s,1);
  if(ef.includes('bc-heal6'))healHero(s,6);
  if(ef.includes('bc-freeze1')){const t=randEnemyMinion(s);if(t){t.c.frozen=true;t.c.canAtk=false;}}
  if(ef.includes('bc-freeze-all'))enemyMinions(s).forEach(t=>{t.c.frozen=true;t.c.canAtk=false;});
  if(ef.includes('bc-clear'))enemySeats(s).forEach(e=>P(e).field=[]);
  if(ef.includes('bc-aoe3'))enemyMinions(s).forEach(t=>hitMinion(t.c,3));
  if(ef.includes('bc-aoe2'))enemyMinions(s).forEach(t=>hitMinion(t.c,2));
  if(ef.includes('bc-divine-all'))P(s).field.forEach(c=>{if(c)c.ds=true;});
  if(ef.includes('bc-rand3-2')){for(let i=0;i<2;i++){const t=randEnemyMinion(s);if(t)hitMinion(t.c,3);}}
}
function applyAura(card,s){
  if(card.ef.includes('aura-buff2'))P(s).field.forEach(c=>{if(c&&c!==card){c.catk+=2;c.chp+=2;}});
  if(card.ef.includes('aura-hp'))P(s).field.forEach(c=>{if(c&&c!==card)c.chp+=1;});
}
function applySpell(card,s,target){
  const ef=card.ef;
  const single=(d)=>{
    if(target&&target.kind==='minion'){const c=P(target.s).field[target.i];if(c)hitMinion(c,d);else fallbackDmg(s,d);}
    else if(target&&target.kind==='hero'){P(target.s).hp-=d;}
    else fallbackDmg(s,d);
  };
  if(ef.includes('dmg5'))single(5);
  if(ef.includes('dmg4'))single(4);
  if(ef.includes('dmg3'))single(3);
  if(ef.includes('dmg15'))single(15);
  if(ef.includes('hero-dmg8')){const h=(target&&target.kind==='hero')?target.s:randEnemyHero(s);if(h!=null)P(h).hp-=8;}
  if(ef.includes('aoe3')){enemyMinions(s).forEach(t=>hitMinion(t.c,3));enemySeats(s).forEach(e=>P(e).hp-=3);}
  if(ef.includes('aoe5')){enemyMinions(s).forEach(t=>hitMinion(t.c,5));enemySeats(s).forEach(e=>P(e).hp-=5);}
  if(ef.includes('aoe-enemy4'))enemyMinions(s).forEach(t=>hitMinion(t.c,4));
  if(ef.includes('aoe-dmg2')){enemyMinions(s).forEach(t=>hitMinion(t.c,2));enemySeats(s).forEach(e=>P(e).hp-=2);}
  if(ef.includes('aoe-all6')){enemyMinions(s).forEach(t=>hitMinion(t.c,6));enemySeats(s).forEach(e=>P(e).hp-=6);}
  if(ef.includes('aoe-heal2')){P(s).field.forEach(c=>{if(c)c.chp=Math.min(c.h,c.chp+2);});healHero(s,2);}
  if(ef.includes('heal5'))healHero(s,5);
  if(ef.includes('heal10'))healHero(s,10);
  if(ef.includes('freeze1')){const t=(target&&target.kind==='minion')?{c:P(target.s).field[target.i]}:randEnemyMinion(s);if(t&&t.c){t.c.frozen=true;t.c.canAtk=false;}}
  if(ef.includes('freeze-all-enemy')||ef.includes('freeze-all'))enemyMinions(s).forEach(t=>{t.c.frozen=true;t.c.canAtk=false;});
  if(ef.includes('exec3'))enemyMinions(s).forEach(t=>{if(t.c.chp<=3)t.c.chp=0;});
  if(ef.includes('destroy1')){const t=randEnemyMinion(s);if(t)t.c.chp=0;}
  if(ef.includes('destroy-all-enemy'))enemyMinions(s).forEach(t=>t.c.chp=0);
  if(ef.includes('hero-dmg8')){}
  if(ef.includes('buff-all3'))P(s).field.forEach(c=>{if(c){c.catk+=3;c.chp+=3;}});
  if(ef.includes('buff-all1'))P(s).field.forEach(c=>{if(c){c.catk+=1;c.chp+=1;}});
  if(ef.includes('chain4-3')){for(let i=0;i<3;i++){const t=randEnemyMinion(s);if(t)hitMinion(t.c,4);else{const h=randEnemyHero(s);if(h!=null)P(h).hp-=4;}}}
  if(ef.includes('drain5')){const t=randEnemyMinion(s);if(t){hitMinion(t.c,5);healHero(s,5);}else{const h=randEnemyHero(s);if(h!=null){P(h).hp-=5;healHero(s,5);}}}
  if(ef.includes('draw3'))draw(s,3);
  cleanAll();
}
function fallbackDmg(s,d){const t=randEnemyMinion(s);if(t)hitMinion(t.c,d);else{const h=randEnemyHero(s);if(h!=null)P(h).hp-=d;}}
function allyMinions(){return[];}
function applyArtifact(card,s){
  const ef=card.ef;
  if(ef.includes('hero-atk3'))P(s).heroAtk=3;
  if(ef.includes('hero-divine'))P(s).heroDivine=true;
  if(ef.includes('draw3'))draw(s,3);
  if(ef.includes('buff-all1'))P(s).field.forEach(c=>{if(c){c.catk+=1;c.chp+=1;}});
}
function hasTaunt(seat){return P(seat).field.some(c=>c&&c.ef.includes('taunt'));}
function hAttack(as,mi,ts,ti){
  if(as!==G.turnSeat)return;
  const atk=P(as).field[mi];if(!atk||!atk.canAtk)return;
  if(P(ts).team===P(as).team)return;
  const dmg=atk.catk;
  if(ti<0){
    if(hasTaunt(ts))return;
    if(P(ts).heroDivine)P(ts).heroDivine=false;else P(ts).hp-=dmg;
    if(atk.ef.includes('lifesteal'))healHero(as,dmg);
    G.log=`<span>${atk.n}</span> → ${P(ts).name} 영웅`;
  }else{
    const tgt=P(ts).field[ti];if(!tgt)return;
    if(hasTaunt(ts)&&!tgt.ef.includes('taunt'))return;
    if(atk.ef.includes('poison'))tgt.chp=0;else hitMinion(tgt,dmg);
    if(tgt.chp>0){if(atk.ds)atk.ds=false;else hitMinion(atk,tgt.catk);}
    if(atk.ef.includes('lifesteal'))healHero(as,dmg);
    if(atk.ef.includes('cleave2'))P(ts).field.forEach((c,i)=>{if(c&&i!==ti)hitMinion(c,2);});
    G.log=`<span>${atk.n}</span> → <span>${tgt.n}</span>`;
  }
  atk.canAtk=false;cleanAll();checkWin();broadcast();
}
function checkWin(){
  G.players.forEach(p=>{if(p.hp<=0)p.alive=false;});
  [0,1].forEach(tm=>{const alive=G.players.filter(p=>p.team===tm&&p.alive);if(!alive.length&&G.winnerTeam===null)G.winnerTeam=(tm===0?1:0);});
}

/* ═══════════ AI ═══════════ */
function aiRun(s){
  if(!G||!G.started||G.turnSeat!==s)return;
  const p=P(s);
  let ch=true;
  while(ch){ch=false;
    const aff=p.hand.filter(c=>c&&c.c<=p.mn&&(c.t!=='c'||p.field.length<7)).sort((a,b)=>b.c-a.c);
    if(!aff.length)break;
    const card=aff[0];const idx=p.hand.indexOf(card);
    let target=null;
    const em=enemyMinions(s).slice().sort((a,b)=>a.c.chp-b.c.chp);
    const eh=enemySeats(s).map(e=>({s:e,hp:P(e).hp})).sort((a,b)=>a.hp-b.hp);
    if(card.ef.includes('hero-dmg8')&&eh.length)target={kind:'hero',s:eh[0].s};
    else if(card.ef.includes('freeze1')&&em.length)target={kind:'minion',s:em[0].s,i:em[0].i};
    else if(em.length&&card.ef.some(e=>['dmg3','dmg4','dmg5','dmg15'].includes(e)))target={kind:'minion',s:em[0].s,i:em[0].i};
    else if(eh.length)target={kind:'hero',s:eh[0].s};
    hPlay(s,idx,target);ch=true;
    if(G.winnerTeam!==null){afterAI(s);return;}
  }
  setTimeout(()=>{
    if(!G||G.turnSeat!==s){return;}
    P(s).field.forEach((atk,i)=>{
      if(!atk||!atk.canAtk)return;
      let done=false;
      for(const e of enemySeats(s)){if(hasTaunt(e)){const ti=P(e).field.findIndex(c=>c&&c.ef.includes('taunt'));if(ti>=0){hAttack(s,i,e,ti);done=true;break;}}}
      if(done||G.winnerTeam!==null)return;
      const eh=enemySeats(s).map(e=>({s:e,hp:P(e).hp})).sort((a,b)=>a.hp-b.hp);
      if(eh.length){
        if(Math.random()<0.6)hAttack(s,i,eh[0].s,-1);
        else{const em=enemyMinions(s);if(em.length)hAttack(s,i,em[0].s,em[0].i);else hAttack(s,i,eh[0].s,-1);}
      }
    });
    afterAI(s);
  },900);
}
function afterAI(s){broadcast();setTimeout(()=>{if(G&&G.winnerTeam===null&&G.turnSeat===s)hAdvance(s);},600);}

/* ═══════════ 네트워크 (호스트 권위) ═══════════ */
function broadcast(){
  if(!isHost)return;
  const payload={t:'state',G:serializeG()};
  conns.forEach(c=>{if(c&&c.open)c.send(JSON.stringify(payload));});
  applyView(G);            // 호스트 본인도 같은 렌더 경로
}
function serializeG(){return JSON.parse(JSON.stringify({mode:G.mode,rule:G.rule,R:G.R,players:G.players,order:G.order,turnSeat:G.turnSeat,started:G.started,winnerTeam:G.winnerTeam,log:G.log}));}

function applyView(g){
  G=g;
  renderGame();
  if(g.winnerTeam!==null)showWin();
}

function doReq(action){
  if(isHost){
    if(action.kind==='play')hPlay(MYSEAT,action.idx,action.target);
    else if(action.kind==='attack')hAttack(MYSEAT,action.mi,action.ts,action.ti);
    else if(action.kind==='end')hAdvance(MYSEAT);
  }else{
    if(hostConn&&hostConn.open)hostConn.send(JSON.stringify({t:'req',seat:MYSEAT,action}));
  }
}

/* ── 호스트: 방 생성 ── */
function genCode(){return String(Math.floor(1000+Math.random()*9000));}
let roomCode='';
let roomNames=[];   // {seat,name}
function hostRoom(){
  isHost=true;soloMode=false;
  roomCode=genCode();
  roomNames=[{seat:0,name:myName()}];
  setLS('방 생성 중...');
  peer=new Peer('arcane'+roomCode,{debug:0});
  peer.on('open',()=>{ openRoomUI(); });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){roomCode=genCode();peer.destroy();peer=new Peer('arcane'+roomCode,{debug:0});bindHostPeer();}
    else setLS('오류: '+e.type);
  });
  bindHostPeer();
}
function bindHostPeer(){
  peer.on('open',()=>openRoomUI());
  peer.on('connection',c=>{
    c.on('open',()=>{
      const seat=assignSeat();
      if(seat<0){c.send(JSON.stringify({t:'full'}));setTimeout(()=>c.close(),300);return;}
      conns.push(c);
      c._seat=seat;
      c.on('data',d=>onHostData(c,JSON.parse(d)));
      c.on('close',()=>{ // 게스트 이탈 → AI 대체 (게임 중)
        conns=conns.filter(x=>x!==c);
        if(G&&G.started){const p=G.players[c._seat];if(p){p.isAI=true;notify(p.name+' 이탈 → AI 대체');if(G.turnSeat===p.seat&&isHost)setTimeout(()=>aiRun(p.seat),300);broadcast();}}
      });
    });
  });
}
function assignSeat(){
  const cap=Math.max(...TEAMS[selMode])*2 - (TEAMS[selMode][0]===TEAMS[selMode][1]?0:0);
  const total=TEAMS[selMode][0]+TEAMS[selMode][1];
  const taken=new Set(roomNames.map(r=>r.seat));
  for(let s=0;s<total;s++)if(!taken.has(s))return s;
  return -1;
}
function onHostData(c,msg){
  if(msg.t==='join'){
    roomNames=roomNames.filter(r=>r.seat!==c._seat);
    roomNames.push({seat:c._seat,name:msg.name||'마법사'});
    c.send(JSON.stringify({t:'welcome',seat:c._seat,mode:selMode,rule:selRule,code:roomCode}));
    sendLobby();
    renderSeatlist();
  }else if(msg.t==='req'){
    if(!G||!G.started)return;
    const seat=c._seat,a=msg.action;
    if(a.kind==='play')hPlay(seat,a.idx,a.target);
    else if(a.kind==='attack')hAttack(seat,a.mi,a.ts,a.ti);
    else if(a.kind==='end')hAdvance(seat);
  }else if(msg.t==='rematch-req'){
    // 게스트가 재시작 원함 (호스트가 결정)
  }
}
function sendLobby(){
  const payload={t:'lobby',mode:selMode,rule:selRule,code:roomCode,seats:lobbySeats()};
  conns.forEach(c=>{if(c&&c.open)c.send(JSON.stringify(payload));});
}
function lobbySeats(){
  const total=TEAMS[selMode][0]+TEAMS[selMode][1];const arr=[];
  for(let s=0;s<total;s++){const r=roomNames.find(x=>x.seat===s);arr.push({seat:s,team:s%2,name:r?r.name:null});}
  return arr;
}

/* ── 게스트: 참가 ── */
function joinRoom(){
  const code=(document.getElementById('codein').value||'').trim();
  if(!/^\d{4}$/.test(code)){notify('4자리 숫자 코드를 입력하세요!');return;}
  isHost=false;soloMode=false;
  setLS('연결 중...');
  peer=new Peer({debug:0});
  peer.on('open',()=>{
    hostConn=peer.connect('arcane'+code,{reliable:true});
    hostConn.on('open',()=>{hostConn.send(JSON.stringify({t:'join',name:myName()}));setLS('방 입장 중...');});
    hostConn.on('data',d=>onGuestData(JSON.parse(d)));
    hostConn.on('error',()=>setLS('연결 실패. 코드를 확인하세요.'));
    hostConn.on('close',()=>{notify('호스트와 연결이 끊겼습니다.');});
  });
  peer.on('error',e=>setLS('오류: '+(e.type==='peer-unavailable'?'그런 방이 없습니다':e.type)));
}
function onGuestData(msg){
  if(msg.t==='full'){setLS('방이 가득 찼습니다.');return;}
  if(msg.t==='welcome'){MYSEAT=msg.seat;selMode=msg.mode;selRule=msg.rule;roomCode=msg.code;openRoomUI(true);}
  else if(msg.t==='lobby'){selMode=msg.mode;selRule=msg.rule;roomCode=msg.code;renderSeatlist(msg.seats);}
  else if(msg.t==='start'){enterGame();}
  else if(msg.t==='state'){applyView(msg.G);if(document.getElementById('game').classList.contains('hidden'))enterGame();}
}

function send(){} // legacy no-op

/* ── 호스트 시작 ── */
function hostStart(){
  // 빈자리 = AI, 이름 배정
  AI_IDX=0;
  startGame(selMode,selRule,roomNames);
  conns.forEach(c=>{if(c&&c.open)c.send(JSON.stringify({t:'start'}));});
  enterGame();
  broadcast();
}

/* ── 솔로 ── */
function playSolo(){
  isHost=true;soloMode=true;MYSEAT=0;conns=[];
  AI_IDX=0;
  roomNames=[{seat:0,name:myName()}];
  startGame(selMode,selRule,[{seat:0,name:myName()}]);
  enterGame();
  broadcast();
}

/* ═══════════ 화면 전환 ═══════════ */
function myName(){const el=document.getElementById('mn');return((el&&el.value?el.value:'').trim())||'마법사';}
function openRoomUI(guest){
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('room').classList.remove('hidden');
  document.getElementById('codev').textContent=roomCode;
  document.getElementById('roomMode').textContent=`${selMode.toUpperCase()} · ${RULES[selRule].name} 모드`;
  const sb=document.getElementById('startBtn');
  if(guest){sb.style.display='none';document.getElementById('rstat').textContent='호스트가 시작하기를 기다리는 중...';document.getElementById('rstat').className='smsg';}
  else{sb.style.display='';setLSr('친구에게 코드를 공유하세요!');}
  renderSeatlist();
}
function renderSeatlist(seats){
  const list=seats||lobbySeats();
  const el=document.getElementById('seatlist');el.innerHTML='';
  list.forEach(s=>{
    const filled=!!s.name;
    const row=document.createElement('div');row.className='seatrow'+(filled?'':' empty');
    const me=(isHost&&s.seat===0)||(!isHost&&s.seat===MYSEAT);
    row.innerHTML=`<span class="tg tg${s.team}">${s.team===0?'A팀':'B팀'}</span><span class="snm">${filled?s.name:'대기/AI'}${me?' (나)':''}</span><span class="stat">${filled?'✓':'…'}</span>`;
    el.appendChild(row);
  });
}
function enterGame(){
  sel=null;
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('room').classList.add('hidden');
  document.getElementById('wo').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  renderGame();
}
function leaveRoom(){location.reload();}
function goLobby(){location.reload();}

/* ═══════════ 렌더 ═══════════ */
function renderGame(){
  if(!G)return;
  const myTeam=G.players[MYSEAT]?G.players[MYSEAT].team:0;
  const allies=G.players.filter(p=>p.team===myTeam).sort((a,b)=>(a.idx===MYSEAT?-1:b.idx===MYSEAT?1:a.idx-b.idx));
  const enemies=G.players.filter(p=>p.team!==myTeam).sort((a,b)=>a.idx-b.idx);
  renderZone('zEnemy',enemies,true);
  renderZone('zAlly',allies,false);
  renderHand();
  // 턴 표시
  const myTurn=G.turnSeat===MYSEAT&&G.winnerTeam===null;
  const ti=document.getElementById('ti');
  if(G.winnerTeam!==null){ti.textContent='게임 종료';ti.classList.remove('on');}
  else if(myTurn){ti.textContent='⚔ 내 턴';ti.classList.add('on');}
  else{ti.textContent=(G.players[G.turnSeat]?G.players[G.turnSeat].name:'')+' 턴...';ti.classList.remove('on');}
  document.getElementById('bet').disabled=!myTurn;
  document.getElementById('gl').innerHTML=G.log||'';
  // fx: hp 감소 시 파티클
  G.players.forEach(p=>{
    if(prevHp[p.idx]!==undefined&&p.hp<prevHp[p.idx]){
      const el=document.querySelector('.pp[data-seat="'+p.idx+'"]');
      if(el){const r=el.getBoundingClientRect();parts(r.left+r.width/2,r.top+r.height/2,'#ff4444',12);}
    }
    prevHp[p.idx]=p.hp;
  });
}
function renderZone(zid,players,isEnemy){
  const z=document.getElementById(zid);z.innerHTML='';
  players.forEach(p=>{
    const pp=document.createElement('div');
    pp.className='pp '+(isEnemy?'enemy':'ally')+(p.idx===MYSEAT?' me':'')+(p.idx===G.turnSeat&&G.winnerTeam===null?' turn':'')+(p.alive?'':' dead');
    pp.dataset.seat=p.idx;
    // 적 영웅 타겟 가능?
    if(isEnemy&&G.winnerTeam===null&&canTargetHero(p.idx))pp.classList.add('tgt-hero');
    const hpPct=Math.max(0,(p.hp/p.maxHp)*100);
    const fxIco=(p.heroDivine?'<span style="color:#ffe066">✦</span>':'')+(p.heroAtk?'<span style="color:#ff9a8a">⚔'+p.heroAtk+'</span>':'');
    const ehand=isEnemy?`<div class="ehand">${'<div class="ehc"></div>'.repeat(Math.min(p.handCount??(p.idx===MYSEAT?0:countHand(p)),8))}</div>`:'';
    pp.innerHTML=`
      <div class="pph">
        <div class="pav">🧙</div>
        <div class="pmid">
          <div class="pnm">${p.name}</div>
          <div class="hprow"><div class="hpbar"><div class="hpfill" style="width:${hpPct}%"></div></div><span class="hptx">${Math.max(0,p.hp)}</span></div>
        </div>
        <div class="pright"><div class="mn">💧${p.mn}/${p.mmn}</div><div class="dk">🃏${p.deck.length}</div><div class="hero-fx">${fxIco}</div></div>
      </div>
      ${ehand}
      <div class="ppb" data-board="${p.idx}"></div>`;
    z.appendChild(pp);
    // 영웅 클릭 (공격 대상)
    pp.addEventListener('click',ev=>{
      if(ev.target.closest('.tok'))return;
      if(isEnemy)onHeroClick(p.idx);
    });
    // 미니언
    const board=pp.querySelector('.ppb');
    p.field.forEach((c,i)=>{
      const tk=mkTok(c,p.idx,isEnemy);
      board.appendChild(tk);
    });
  });
}
function countHand(p){return p.hand?p.hand.length:0;}
function mkTok(c,seat,isEnemy){
  const tk=document.createElement('div');
  tk.className=`tok el-${c.e}`+(c.frozen?' frz':'')+(c.ef.includes('taunt')?' taunt':'');
  const mine=seat===MYSEAT;
  const myTurn=G.turnSeat===MYSEAT&&G.winnerTeam===null;
  if(mine&&myTurn&&c.canAtk&&!sel)tk.classList.add('cana');
  if(sel&&sel.kind==='attack'&&mine&&sel.mi===indexOfField(seat,c))tk.classList.add('sel');
  if(isEnemy&&G.winnerTeam===null&&canTargetMinion(seat,c))tk.classList.add('tgt');
  const ico=(c.ds?'✦':'')+(c.frozen?'❄':'');
  tk.innerHTML=`<div class="te"><span>${c.m}</span></div><div class="tnm">${c.n}</div><div class="tstat"><span class="ta">⚔${c.catk}</span><span class="th">❤${c.chp}</span></div><span class="ico">${ico}</span>`;
  tk.addEventListener('click',e=>{e.stopPropagation();onTokClick(seat,c,isEnemy);});
  tk.onmouseenter=ev=>showTT(ev,c);tk.onmouseleave=hideTT;
  return tk;
}
function indexOfField(seat,c){return G.players[seat].field.indexOf(c);}
function renderHand(){
  const h=document.getElementById('ph');h.innerHTML='';
  const me=G.players[MYSEAT];if(!me)return;
  const myTurn=G.turnSeat===MYSEAT&&G.winnerTeam===null;
  me.hand.forEach((card,i)=>{
    const el=mkCard(card,myTurn&&me.mn>=card.c);
    if(sel&&sel.kind==='spell'&&sel.hi===i)el.classList.add('sel');
    el.onclick=()=>onHandClick(i);
    el.onmouseenter=ev=>showTT(ev,card);el.onmouseleave=hideTT;
    h.appendChild(el);
  });
}
function mkCard(card,playable){
  const el=document.createElement('div');
  el.className=`card el-${card.e} rarity-${card.r}`;
  if(playable)el.classList.add('play');
  const kws=card.ef.filter(e=>KW[e]).slice(0,3).map(e=>`<div style="font-size:.32rem;padding:1px 3px;border-radius:2px;color:#fff;font-weight:700;background:#234" >${KW[e]}</div>`).join('');
  const st=card.t==='c'?`<div class="cs2"><div class="sa">⚔${card.a}</div><div class="gem"></div><div class="sh">❤${card.h}</div></div>`:'';
  el.innerHTML=`<div class="ci"><div class="cc">${card.c}</div><div class="ca2"><div class="cab"></div><span style="position:relative;z-index:1">${card.m}</span></div><div class="cb"><div class="cn">${card.n}</div><div class="ct">${EL[card.e]||card.e}·${TP[card.t]}</div><div class="cd">${card.d}</div>${st}<div style="display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px">${kws}</div></div></div>`;
  return el;
}

/* ═══════════ 타게팅 규칙 ═══════════ */
function needsTarget(card){return card.t==='s'&&card.ef.some(e=>TARGET_EF.includes(e));}
function heroOnly(card){return card.ef.includes('hero-dmg8');}
function minionOnly(card){return card.ef.includes('freeze1');}
function canTargetHero(seat){ // 공격/주문 대상으로 영웅 가능?
  if(!sel)return false;
  if(G.players[seat].team===G.players[MYSEAT].team)return false;
  if(sel.kind==='attack')return !hasTaunt(seat);
  if(sel.kind==='spell'){const c=sel.card;if(minionOnly(c))return false;return true;}
  return false;
}
function canTargetMinion(seat,c){
  if(!sel)return false;
  if(G.players[seat].team===G.players[MYSEAT].team)return false;
  if(sel.kind==='attack'){if(hasTaunt(seat)&&!c.ef.includes('taunt'))return false;return true;}
  if(sel.kind==='spell'){const sc=sel.card;if(heroOnly(sc))return false;return true;}
  return false;
}

/* ═══════════ 인터랙션 ═══════════ */
function onHandClick(i){
  if(G.turnSeat!==MYSEAT||G.winnerTeam!==null)return;
  const me=G.players[MYSEAT],card=me.hand[i];if(!card)return;
  if(me.mn<card.c){notify('마나 부족! 💧');return;}
  if(card.t==='c'&&me.field.length>=7){notify('전장 꽉 참!');return;}
  if(needsTarget(card)){
    // 유효 대상 존재?
    const anyM=enemyMinions(MYSEAT).length>0;
    if(heroOnly(card)){sel={kind:'spell',hi:i,card};notify(`${card.n} — 적 영웅 선택`);renderGame();return;}
    if(minionOnly(card)){if(!anyM){doReq({kind:'play',idx:i,target:null});sel=null;return;}sel={kind:'spell',hi:i,card};notify(`${card.n} — 적 미니언 선택`);renderGame();return;}
    sel={kind:'spell',hi:i,card};notify(`${card.n} — 대상 선택`);renderGame();return;
  }
  doReq({kind:'play',idx:i,target:null});sel=null;
}
function onTokClick(seat,c,isEnemy){
  if(G.turnSeat!==MYSEAT||G.winnerTeam!==null)return;
  if(!isEnemy){
    // 내 미니언: 공격자 선택 (sel이 spell이면 무시)
    if(seat!==MYSEAT)return; // 아군(타인)미니언은 조작 불가
    if(sel&&sel.kind==='spell')return;
    const idx=indexOfField(seat,c);
    if(sel&&sel.kind==='attack'&&sel.mi===idx){sel=null;renderGame();return;}
    if(!c.canAtk){notify('이번 턴 공격 불가!');return;}
    sel={kind:'attack',mi:idx};notify(`${c.n} — 공격 대상 선택`);renderGame();
  }else{
    if(!sel){notify('내 미니언 또는 카드를 먼저 선택!');return;}
    if(sel.kind==='attack'){
      if(!canTargetMinion(seat,c)){notify('도발 미니언을 먼저!');return;}
      const ti=indexOfField(seat,c);
      doReq({kind:'attack',mi:sel.mi,ts:seat,ti});sel=null;
    }else if(sel.kind==='spell'){
      if(!canTargetMinion(seat,c)){notify('대상이 올바르지 않습니다.');return;}
      const ti=indexOfField(seat,c);
      doReq({kind:'play',idx:sel.hi,target:{kind:'minion',s:seat,i:ti}});sel=null;
    }
  }
}
function onHeroClick(seat){
  if(G.turnSeat!==MYSEAT||G.winnerTeam!==null||!sel)return;
  if(sel.kind==='attack'){
    if(!canTargetHero(seat)){notify('도발 미니언이 막고 있습니다!');return;}
    doReq({kind:'attack',mi:sel.mi,ts:seat,ti:-1});sel=null;
  }else if(sel.kind==='spell'){
    if(!canTargetHero(seat)){notify('영웅을 대상으로 할 수 없습니다.');return;}
    doReq({kind:'play',idx:sel.hi,target:{kind:'hero',s:seat}});sel=null;
  }
}
function reqEnd(){if(G.turnSeat!==MYSEAT||G.winnerTeam!==null)return;sel=null;doReq({kind:'end'});}

/* ═══════════ 승패/재시작 ═══════════ */
function showWin(){
  const myTeam=G.players[MYSEAT].team;
  const won=G.winnerTeam===myTeam;
  document.getElementById('wo').classList.remove('hidden');
  const t=document.getElementById('wt'),s=document.getElementById('ws');
  if(won){t.textContent='⚔ 승리!';t.className='wt win';s.textContent=(G.mode!=='1v1'?'우리 팀이':'')+' 적을 물리쳤습니다!';}
  else{t.textContent='💀 패배...';t.className='wt lose';s.textContent='다음엔 이길 수 있습니다!';}
  const reBtn=document.getElementById('btnRe');
  if(isHost){reBtn.style.display='';reBtn.textContent=soloMode?'🔄 다시 하기':'🔄 다시 시작 (호스트)';document.getElementById('rmstat').textContent='';}
  else{reBtn.style.display='none';document.getElementById('rmstat').textContent='호스트의 재시작을 기다리는 중...';document.getElementById('rmstat').className='rmstat waiting';}
  for(let i=0;i<5;i++)setTimeout(()=>parts(window.innerWidth/2,window.innerHeight/2,won?'#c9a227':'#ff4444',26),i*200);
}
function rematch(){
  if(!isHost)return;
  AI_IDX=0;
  document.getElementById('wo').classList.add('hidden');
  startGame(selMode,selRule,roomNames);
  conns.forEach(c=>{if(c&&c.open)c.send(JSON.stringify({t:'start'}));});
  enterGame();broadcast();
}

/* ═══════════ 파티클/툴팁/알림 ═══════════ */
function trigA(key){const d=AMAP[key]||AMAP.default;parts(window.innerWidth/2+(Math.random()-.5)*150,window.innerHeight/2+(Math.random()-.5)*80,d.c,d.n);}
function parts(x,y,color,n){
  const layer=document.getElementById('pl');
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='particle';
    const s=3+Math.random()*7;
    p.style.cssText=`width:${s}px;height:${s}px;background:${color};box-shadow:0 0 ${s}px ${color};left:${x}px;top:${y}px;--tx:${(Math.random()-.5)*200}px;--ty:${(Math.random()-1.2)*200}px;animation-duration:${.5+Math.random()*.7}s;animation-delay:${Math.random()*.12}s`;
    layer.appendChild(p);setTimeout(()=>p.remove(),1300);
  }
}
function showTT(e,card){
  const tt=document.getElementById('tt');
  const bs=card.ef.map(ef=>`<span class="ttb">${KW[ef]||ef}</span>`).join('');
  tt.innerHTML=`<div class="ttn">${card.m} ${card.n}</div><div class="ttd">${card.d}</div><div class="tts"><span>💧${card.c}</span>${card.t==='c'?`<span>⚔${card.catk??card.a}</span><span>❤${card.chp??card.h}</span>`:''}<span style="color:${RC[card.r]}">${RL[card.r]}</span></div><div class="tte">${bs}</div>`;
  tt.className='tt vis';posTT(e);
}
function hideTT(){document.getElementById('tt').className='tt';}
function posTT(e){const tt=document.getElementById('tt');let x=e.clientX+12,y=e.clientY-18;if(x+185>window.innerWidth)x=e.clientX-190;if(y+200>window.innerHeight)y=window.innerHeight-200;if(y<4)y=4;tt.style.left=x+'px';tt.style.top=y+'px';}
document.addEventListener('mousemove',e=>{const tt=document.getElementById('tt');if(tt.classList.contains('vis'))posTT(e);});
function notify(msg){const el=document.createElement('div');el.className='notif';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}
function setLS(m){document.getElementById('lstat').textContent=m;}
function setLSr(m){document.getElementById('rstat').textContent=m;document.getElementById('rstat').className='smsg';}
function copyCode(){navigator.clipboard.writeText(roomCode).then(()=>notify('코드 복사됨! 📋 '+roomCode));}

/* ═══════════ 모드 선택 UI ═══════════ */
function bindSeg(id,setter,group){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{
      group.forEach(gid=>document.querySelectorAll('#'+gid+' button').forEach(x=>x.classList.remove('sel')));
      b.classList.add('sel');setter(b.dataset.v);
    };
  });
}

/* ═══════════ 시작 ═══════════ */
window.addEventListener('DOMContentLoaded',async()=>{
  await loadCards();
  document.getElementById('loadover').classList.add('hidden');
  document.getElementById('lobby').classList.remove('hidden');
  bindSeg('segTeam',v=>selMode=v,['segTeam']);
  bindSeg('segRule',v=>selRule=v,['segRule','segRule2']);
  bindSeg('segRule2',v=>selRule=v,['segRule','segRule2']);
  document.getElementById('codein').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);});
});
</script>
